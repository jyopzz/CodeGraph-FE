<mat-card class="agent-details-card" appearance="outlined">
  <mat-card-header>
    <div class="header-content">
      <div>
        <mat-card-title>
          {{ isCreating ? "New Agent" : agent?.name || "Agent Details" }}
        </mat-card-title>

        <mat-card-subtitle>
          {{ isCreating ? "Create a new agent" : agent?.agentId || "Select an agent from the table" }}
        </mat-card-subtitle>
      </div>

      <button
        mat-icon-button
        type="button"
        aria-label="Add agent"
        (click)="startNewAgent()"
      >
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </mat-card-header>

  <mat-card-content>
    <div *ngIf="!hasAgent && !isCreating" class="empty-state">
      <mat-icon>touch_app</mat-icon>

      <div>
        <div class="empty-title">No agent selected</div>
        <div class="empty-text">
          Select an agent from the table to view its configuration.
        </div>
      </div>
    </div>

    <form
      *ngIf="hasAgent || isCreating"
      class="agent-form"
      [formGroup]="agentForm"
      (ngSubmit)="saveAgent()"
    >
      <mat-form-field appearance="outline" class="agent-id-field">
        <mat-label>Agent Id</mat-label>
        <input matInput formControlName="agentId" [readonly]="!isCreating" />
      </mat-form-field>

      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Host</mat-label>
          <input matInput formControlName="host" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Protocol</mat-label>
          <input matInput formControlName="protocol" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Port</mat-label>
          <input matInput type="number" formControlName="port" />
        </mat-form-field>

      </div>

      <div class="form-actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="agentForm.pristine">Save</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

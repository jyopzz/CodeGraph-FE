<h2 mat-dialog-title>
  Connect to CodeGraph Agent
</h2>

<mat-dialog-content>

  <div class="pairing-content">

    <mat-icon class="pairing-icon">
      security
    </mat-icon>

    <p class="description">
      Enter the 6-digit pairing code displayed by the
      CodeGraph Agent running on your Windows machine.
    </p>

    <mat-form-field
      appearance="outline"
      class="pairing-field"
    >
      <mat-label>Pairing Code</mat-label>

      <input
        matInput
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="123456"
        [value]="pairingCode"
        (input)="onCodeInput($event)"
        (keyup.enter)="pair()"
        [disabled]="isPairing"
      />

      <mat-hint>
        Enter the 6-digit code shown by the Agent
      </mat-hint>
    </mat-form-field>

    <div
      *ngIf="errorMessage"
      class="error-message"
    >
      <mat-icon>error</mat-icon>

      <span>
        {{ errorMessage }}
      </span>
    </div>

    <div
      *ngIf="isPairing"
      class="pairing-progress"
    >
      <mat-spinner diameter="24"></mat-spinner>

      <span>
        Establishing secure connection...
      </span>
    </div>

  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()"
    [disabled]="isPairing"
  >
    Cancel
  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    (click)="pair()"
    [disabled]="pairingCode.length !== 6 || isPairing"
  >
    <mat-spinner
      *ngIf="isPairing"
      diameter="18"
    ></mat-spinner>

    <span *ngIf="!isPairing">
      Connect
    </span>

    <span *ngIf="isPairing">
      Pairing...
    </span>
  </button>

</mat-dialog-actions>

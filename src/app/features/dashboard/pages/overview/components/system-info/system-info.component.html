<mat-card class="system-info-card" appearance="outlined">
  <mat-card-header class="system-info-header">
    <mat-card-title>System Info</mat-card-title>

    <div class="header-actions">
      <mat-form-field appearance="outline" class="agent-select">
        <mat-label>Agent</mat-label>

        <mat-select
          [(value)]="selectedAgentId"
          (selectionChange)="onAgentChange($event.value)"
        >
          <mat-option *ngFor="let agent of agents" [value]="agent.agentId">
            {{ agent.name || agent.agentId }} - {{ agent.agentId }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <button
        *ngIf="!isAgentPaired"
        mat-stroked-button
        color="primary"
        (click)="openPairingDialog()"
      >
        <mat-icon>link</mat-icon>
        Pair Agent
      </button>

      <button
        *ngIf="isAgentPaired"
        mat-stroked-button
        color="warn"
        (click)="onUnpair()"
        [disabled]="isUnpairing"
      >
        <mat-icon>link_off</mat-icon>
        {{ isUnpairing ? "Unpairing..." : "Unpair" }}
      </button>

      <button
        mat-stroked-button
        color="primary"
        (click)="onManualCheck()"
        [disabled]="isChecking"
      >
        <mat-icon [class.spinning]="isChecking">sync</mat-icon>
        {{ isChecking ? "Checking..." : "Check Connection" }}
      </button>

      <button
        mat-flat-button
        color="accent"
        (click)="onRunScript()"
        [disabled]="!agentStatus || isExecuting"
      >
        <mat-icon [class.spinning]="isExecuting">play_arrow</mat-icon>
        {{ isExecuting ? "Running..." : "Run ATS Scan" }}
      </button>
    </div>
  </mat-card-header>
</mat-card>
